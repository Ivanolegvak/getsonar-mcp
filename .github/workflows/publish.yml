# Publishes getsonar-mcp to PyPI (Trusted Publishing, no token) and then
# to the official MCP Registry (GitHub OIDC login, no token).
# Runs on a published GitHub release or manually (workflow_dispatch).
#
# Re-runnable: if this version is already on PyPI (PyPI never accepts the
# same version twice), the upload is skipped and the registry job still
# runs, so a re-run (or a manual dispatch) refreshes the MCP Registry entry
# without anyone signing in with `mcp-publisher login github`.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Is this version already on PyPI?
        id: check
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('server.json'))['version'])")
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/getsonar-mcp/$VERSION/json")
          case "$CODE" in
            200) echo "getsonar-mcp $VERSION is already on PyPI; skipping the upload"
                 echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "PyPI answered HTTP $CODE for $VERSION; not guessing" >&2; exit 1 ;;
          esac
      - uses: astral-sh/setup-uv@v6
        if: steps.check.outputs.exists != 'true'
      - run: uv build
        if: steps.check.outputs.exists != 'true'
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
        if: steps.check.outputs.exists != 'true'

  registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Wait until the version is visible on PyPI
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('server.json'))['version'])")
          for i in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/getsonar-mcp/$VERSION/json" >/dev/null && exit 0
            sleep 10
          done
          echo "getsonar-mcp $VERSION not on PyPI yet" >&2; exit 1
      - name: Install mcp-publisher
        run: curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
